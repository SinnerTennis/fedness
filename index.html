<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fedness">
<meta name="theme-color" content="#F0EBE1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Fedness</title>
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 500; font-display: swap; src: url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 800; font-display: swap; src: url("fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: swap; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-display: swap; src: url("fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-display: swap; src: url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Caveat"; font-weight: 600; font-display: swap; src: url("fonts/caveat-latin-600-normal.woff2") format("woff2"); }

:root {
  --paper: #F0EBE1; --ink: #17150F; --muted: #5E584C; --rule: #8F8774; --track: #DCD4C3;
  --pen: #1F3FA6; --flame-text: #B33C06;
  --orange: #FF6A13; --yellow: #FFC72C; --blue: #4CC2FF; --pink: #FF6FB0; --lime: #B6F23A; --violet: #B79CFF; --red: #FF5A4D;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-hand: "Caveat", cursive;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font: 400 16px/1.35 var(--font-body); font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top) 0 calc(60px + env(safe-area-inset-bottom));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 3px solid var(--flame-text); outline-offset: 1px; }
input::placeholder { color: var(--muted); opacity: 1; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
svg { display: block; flex: none; }
main { max-width: 640px; margin: 0 auto; }
section[hidden] { display: none; }
[data-eat], [data-k] { cursor: pointer; user-select: none; -webkit-user-select: none; }

/* struttura */
.head { position: sticky; top: env(safe-area-inset-top); z-index: 5; background: var(--paper); padding: 14px 16px 12px; border-bottom: 2px solid var(--ink); }
.body { padding: 16px 16px 28px; }
.hrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.h1 { margin: 0; font: 800 48px/.95 var(--font-display); text-transform: uppercase; }
.kc { font: 800 36px/1 var(--font-display); }
.kc small { font-weight: 500; font-size: 20px; color: var(--muted); }
.sq { flex: none; width: 32px; height: 32px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--c, transparent); display: flex; align-items: center; justify-content: center; transition: background .2s; }
.sq.lg { width: 34px; height: 34px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 9px 2px 7px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--c); font: 700 16px/1 var(--font-display); letter-spacing: .02em; }
.sec { width: 100%; min-height: 52px; padding: 9px 0 8px; border: 0; border-top: 2px solid var(--ink); background: none; display: flex; align-items: center; gap: 10px; text-align: left; }
.t { margin: 0; font: 800 23px/1 var(--font-display); text-transform: uppercase; }
.sec > .t { flex: 1; min-width: 0; }
.t21 { font-size: 21px; }
.line { width: 100%; min-height: 48px; padding: 6px 0; border-top: 1px dotted var(--rule); display: flex; align-items: center; gap: 10px; text-align: left; }
.line .n { flex: 1; min-width: 0; font-size: 16px; line-height: 1.25; }
.line .q { font: 700 19px var(--font-display); white-space: nowrap; }
.line .k { width: 34px; text-align: right; font: 500 16px var(--font-display); color: var(--muted); }
.line.done .n, .line.done .q { color: var(--muted); }
.line.done .n { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; }
.hand, .line .hand, .hand25 .n { font: 600 24px/1.1 var(--font-hand); color: var(--pen); }
.hand25 .n { font-size: 25px; }
.line.hand25.done .n { color: var(--pen); }
.foot { margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.c { text-align: center; }

/* casella con spunta a penna (7.1) */
.box { position: relative; flex: none; width: 26px; height: 26px; border: 1.5px solid var(--ink); border-radius: 2px; transition: background .2s; }
.box.big { border-width: 2.5px; }
.box.sm { width: 22px; height: 22px; }
.done > .box { background: var(--lime); }
.tick { position: absolute; left: -2px; top: -10px; overflow: visible; display: none; }
.done > .box .tick { display: block; }

/* campo scritto a mano + bottone + (7.6) */
.addrow { display: flex; align-items: flex-end; gap: 10px; }
.fld { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fld > span { font: 600 12px var(--font-display); letter-spacing: .1em; color: var(--muted); }
.fld input { width: 100%; height: 40px; padding: 0 2px; border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0; background: transparent; font: 600 24px var(--font-hand); color: var(--pen); }
.fld.kcal { flex: none; width: 70px; }
.sd { display: block; font: 400 13px/1.3 var(--font-body); color: var(--muted); }
.more summary { padding: 10px 0 4px; font: 600 12px var(--font-display); letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.more[open] summary svg { transform: rotate(180deg); }
.more textarea { width: 100%; margin-top: 4px; padding: 6px; border: 1.5px solid var(--ink); border-radius: 0; background: transparent; font: 400 15px var(--font-body); color: var(--pen); resize: vertical; }
.reset.ocr { margin-top: 8px; }
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; margin-top: 8px; }
.plus { flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 3px; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; }
.xbtn { flex: none; width: 44px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; }

/* Dieta */
#days { display: flex; gap: 4px; }
#days button { flex: 1; min-width: 0; height: 58px; padding: 0; border: 1.5px solid var(--ink); border-radius: 3px; background: transparent; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: background .2s; }
#days .l { font: 800 21px/1 var(--font-display); }
#days .mk { width: 20px; height: 3px; }
#days .today .mk { background: var(--orange); }
#days .closed { background: var(--lime); }
#days .on { background: var(--ink); color: var(--paper); }
.count { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.count .kc { flex: 1; min-width: 0; }
.left { font: 700 19px/1 var(--font-display); }
.left.over { color: var(--flame-text); }
.segs { display: flex; gap: 3px; height: 14px; margin-top: 8px; }
.segs > div { min-width: 0; border: 1.5px solid var(--ink); }
.segs > div > div { height: 100%; background: var(--orange); }
.segs .off { background: var(--pen); }
.chips { display: flex; gap: 6px; margin-top: 8px; }
.chips span { flex: 1; min-width: 0; height: 26px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--c); display: flex; align-items: center; justify-content: center; gap: 5px; font: 600 16px/1 var(--font-display); }
.chips b { font-weight: 800; }
.dayname { display: flex; align-items: center; gap: 12px; }
.stamp-today { border: 2px solid var(--flame-text); border-radius: 3px; padding: 2px 7px; color: var(--flame-text); font: 700 14px var(--font-display); letter-spacing: .14em; transform: rotate(-5deg); }
.act { display: flex; margin-top: 8px; }
.note { margin-top: 14px; border: 1.5px dashed var(--ink); padding: 10px 12px; }
.note .lbl { display: flex; align-items: center; gap: 6px; color: var(--flame-text); font: 700 13px var(--font-display); letter-spacing: .14em; }
.note p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; }
.meal { margin-top: 22px; }
.mt26 { margin-top: 26px; }
.sec.done > .sq { background: var(--lime); }
.mt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.meta { font: 600 16px/1 var(--font-display); color: var(--muted); }
.mmac { padding-top: 8px; border-top: 1px dotted var(--rule); display: flex; align-items: center; gap: 14px; }
.mmac span { display: flex; align-items: center; gap: 5px; font: 600 15px/1 var(--font-display); letter-spacing: .03em; color: var(--muted); }
.mmac i { width: 11px; height: 11px; border: 1.5px solid var(--ink); background: var(--c); }
.d17 { font: 700 17px var(--font-display); }
#offadd { padding-top: 10px; border-top: 1px dotted var(--rule); }
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
details[open] .ch-d, details:not([open]) .ch-u { display: none; }
.sub { padding: 9px 0; border-top: 1px dotted var(--rule); }
.sub .sg { font: 700 14px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sub .sr { font-weight: 600; font-size: 15px; }
.sub p { margin: 3px 0 0; font-size: 14.5px; line-height: 1.45; }

/* Oggi */
.hero { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; flex: none; width: 172px; height: 172px; }
.ring svg { transform: rotate(-90deg); }
.rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.rp { font: 800 60px/.9 var(--font-display); }
.rp small { font-size: 30px; }
.rl, .lbl12 { font: 600 13px var(--font-display); letter-spacing: .14em; color: var(--muted); }
.hr { flex: 1; min-width: 0; }
.hn { margin-top: 8px; font: 800 78px/.85 var(--font-display); }
.hn.over { color: var(--flame-text); }
.hc { margin-top: 6px; font: 700 20px/1.02 var(--font-display); text-transform: uppercase; }
.he { margin-top: 5px; font-size: 14px; color: var(--muted); }
.level { margin-top: 18px; padding: 10px 12px; border-radius: 4px; background: var(--ink); color: var(--paper); display: flex; align-items: center; gap: 12px; }
.level .sq { width: 38px; height: 38px; color: var(--ink); }
.level .lk { font: 700 12px var(--font-display); letter-spacing: .14em; color: #D8D0BF; }
.level .lv { font: 800 30px/1 var(--font-display); }
.level .lh { text-align: right; font: 600 16px/1.15 var(--font-display); }
.next { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.next .tag { font: 700 13px var(--font-display); letter-spacing: .14em; color: var(--flame-text); }
.next .nn { font-weight: 600; }
.next .nm { font-size: 14.5px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.tile { position: relative; min-height: 136px; padding: 10px 11px 11px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--c); display: flex; flex-direction: column; }
.tile .tl { display: flex; align-items: center; gap: 6px; font: 700 14px var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.tile .tn { margin-top: 4px; display: flex; align-items: baseline; gap: 6px; }
.tile .tb { font: 800 56px/.95 var(--font-display); }
.tile .to { font: 600 19px var(--font-display); }
.tile .tf { margin-top: auto; padding-top: 8px; }
.tile .ts { margin-top: 6px; font: 600 15px/1.1 var(--font-display); }
.tbar { height: 12px; border: 1.5px solid var(--ink); background: rgba(240, 235, 225, .55); }
.tbar > div { height: 100%; background: var(--ink); }
.dots { display: flex; gap: 4px; }
.dots span { flex: 1; max-width: 24px; height: 14px; border: 1.5px solid var(--ink); }
.dots .full { background: var(--ink); }
.dots .part { background: rgba(23, 21, 15, .35); }
.stamp { position: absolute; top: 7px; right: 8px; padding: 0 5px; border: 2px solid var(--ink); border-radius: 3px; background: var(--paper); font: 800 12px var(--font-display); letter-spacing: .1em; transform: rotate(-8deg); }
@keyframes fd-pop { 0% { transform: rotate(-8deg) scale(1.9); opacity: 0; } 100% { transform: rotate(-8deg) scale(1); opacity: 1; } }
.stamp.pop { animation: fd-pop .28s cubic-bezier(.2,.9,.3,1.2) both; }
.mt24 { margin-top: 24px; }
/* una sola griglia per tutte le righe: barre della stessa lunghezza */
.micros { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; }
.mrow { display: contents; }
.mrow > div { min-height: 40px; border-top: 1px dotted var(--rule); display: flex; align-items: center; }
.mrow > div + div { padding-left: 10px; }
.mrow > div:first-child { font-size: 15px; }
.mrow small { font-size: 12.5px; color: var(--muted); }
.mbar { flex: 1; height: 12px; border: 1.5px solid var(--ink); display: flex; }
.mbar > div { height: 100%; background: var(--yellow); }
.mbar.ok > div { background: var(--lime); }
.mbar.over > div { background: var(--red); }
.mbar > div.sup { background: repeating-linear-gradient(45deg, var(--pen) 0 2px, transparent 2px 5px); } /* quota da integratori */
.mv { font: 400 17px var(--font-display); white-space: nowrap; }
.mv b { font-weight: 700; }
.mv.over { color: var(--flame-text); }

/* Spesa */
.pbar { height: 14px; margin-top: 10px; border: 1.5px solid var(--ink); }
.pbar > div { height: 100%; background: var(--lime); }
.hrow2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.hrow2 .chip { padding: 0 9px 0 6px; gap: 5px; }
.switch { min-height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; gap: 7px; font-size: 15px; }
.switch .tick { width: 28px; height: 25px; left: -1px; top: -8px; }
.dept { margin-top: 18px; }
.cnt { padding: 1px 7px; border: 1.5px solid var(--ink); border-radius: 3px; font: 700 16px var(--font-display); transition: background .2s; }
.cnt.full { background: var(--lime); }
#list .line { min-height: 52px; padding: 8px 0; gap: 12px; }
#list .hand25 { gap: 4px; }
.empty { margin: 56px 0 0; text-align: center; font: 800 34px var(--font-display); text-transform: uppercase; }
.reset { width: 100%; min-height: 50px; margin-top: 30px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 3px; background: none; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 18px var(--font-display); letter-spacing: .08em; text-transform: uppercase; }

/* Sblocco */
#lock { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; }
#lock[hidden] { display: none; }
#lock form { min-height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;
  padding: calc(24px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom)); }
#lock .logo { width: 85%; max-width: 332px; height: auto; transform: rotate(-3deg); margin-top: 8px; } /* logo scontornato: niente cornice */
#lock .motto { margin: 22px 0 0; font: 800 34px/1 var(--font-display); text-transform: uppercase; text-align: center; }
#lock .fld { flex: none; width: 100%; margin-top: auto; padding-top: 24px; }
#lock .fld input { height: 48px; font: 600 22px var(--font-body); letter-spacing: .2em; color: var(--pen); }
#lock .enter { width: 100%; height: 54px; margin-top: 16px; border: 0; border-radius: 3px; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; gap: 10px; font: 800 22px var(--font-display); letter-spacing: .14em; }
#lock .enter:disabled { opacity: .6; }
#lock-err { min-height: 20px; margin: 10px 0 0; color: var(--flame-text); font: 600 14px var(--font-body); text-align: center; }

/* Tab bar (7.8) */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--paper); border-top: 2px solid var(--ink); display: flex; }
nav button { flex: 1; min-width: 0; padding: 0; border: 0; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
nav button + button { border-left: 1.5px solid var(--ink); }
nav button.on { background: var(--ink); color: var(--paper); }
nav .nl { display: flex; align-items: center; gap: 6px; font: 800 20px/1 var(--font-display); letter-spacing: .1em; }
nav .ns { font: 500 14px/1 var(--font-display); letter-spacing: .03em; color: var(--muted); white-space: nowrap; }
nav .on .ns { color: #D8D0BF; }

@media (prefers-reduced-motion: reduce) { .stamp.pop { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div id="lock">
  <form>
    <img class="logo" src="logo.png" alt="Fedness" width="332" height="332">
    <p class="motto">Diventa una fottuta<br>statua marmorea!</p>
    <input type="text" name="username" value="fedness" autocomplete="username" hidden>
    <label class="fld"><span>PASSWORD</span>
      <input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="enter"><i data-ic="lock" data-s="22"></i>ENTRA</button>
    <p id="lock-err" role="alert"></p>
  </form>
</div>
<main>
  <section id="diet">
    <div class="head"><div id="days"></div><div id="count"></div></div>
    <div id="diet-body" class="body"></div>
  </section>

  <section id="stats" hidden></section>

  <section id="shop" hidden>
    <div class="head">
      <div class="hrow"><h1 class="h1">Spesa</h1><div class="kc" id="prog"></div></div>
      <div class="pbar" id="pbar" role="progressbar" aria-label="Prodotti presi" aria-valuemin="0"><div id="bar"></div></div>
      <div class="hrow2">
        <span class="chip" style="--c:var(--yellow)"><i data-ic="euro" data-s="18"></i><span id="left"></span></span>
        <button id="hide" class="switch" type="button" role="switch" aria-checked="false"><i data-ic="eyeoff" data-s="18"></i><span>Nascondi presi</span><span class="box sm"></span></button>
      </div>
      <form id="add" class="addrow">
        <label class="fld"><span>AGGIUNGI PRODOTTO</span><input placeholder="scrivi qui" enterkeyhint="done"></label>
        <button class="plus" aria-label="Aggiungi alla spesa"><i data-ic="plus" data-s="22"></i></button>
      </form>
    </div>
    <div id="list" class="body"></div>
  </section>
</main>

<nav aria-label="Sezioni">
  <button data-tab="diet"><span class="nl"><i data-ic="kitchen"></i>DIETA</span><span class="ns" id="sub-diet"></span></button>
  <button data-tab="stats"><span class="nl"><i data-ic="flame"></i>OGGI</span><span class="ns" id="sub-stats"></span></button>
  <button data-tab="shop"><span class="nl"><i data-ic="cart"></i>SPESA</span><span class="ns" id="sub-shop"></span></button>
</nav>

<script>
let DIET, SUBS, SHOPPING, FOODS; // arrivano da data.enc.json dopo la password
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem("fedness." + k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem("fedness." + k, JSON.stringify(v)); } catch {} };

// Tabler Icons 3.52.0 (MIT, vedi design/icons/LICENSE-tabler.txt) — path uniti, da design/icons/paths.json
const ICONS = {
  kitchen: "M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12m0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3",

// Ripartisce kcal/P/C/G di ogni pasto (valori PDF) tra gli alimenti, in proporzione a FOODS × grammi.
// Arrotondamento cumulativo → la somma degli alimenti è esattamente il totale del pasto.
function splitMeals() {
  const roundKeepSum = a => { let acc = 0, prev = 0; return a.map(v => { acc += v; const x = Math.round(acc) - prev; prev += x; return x; }); };
  // obiettivo = somma dei pasti (il totale giorno del PDF è arrotondato a parte, ±1)
  for (const d of DIET) d.tot = [3, 4, 5, 6].map(j => d.meals.reduce((s, m) => s + m[j], 0));
  for (const d of DIET) for (const m of d.meals) {
    const est = m[2].map(t => {
      const [, name, g] = t.match(/^(.*?)\s*([\d.]+)\s*(?:g|ml)$/) || [, t, 0];
      const f = FOODS[name.replace(/\s*\(.*?\)/g, "")];
      if (!f) console.warn("FOODS: manca", name);
      return (f || Array(4 + MICROS.length).fill(0)).map(v => v * g / 100);
    });
    const cols = [0, 1, 2, 3].map(j => {
      const tot = est.reduce((s, e) => s + e[j], 0);
      return roundKeepSum(est.map((e, i) => tot ? e[j] * m[3 + j] / tot : i ? 0 : m[3 + j]));
    });
    m.foods = m[2].map((t, i) => ({ t, v: cols.map(c => c[i]), mic: est[i].slice(4) }));
  }
}

// [nome, unità, obiettivo giornaliero (LARN, uomo adulto), è un limite massimo?]
const MICROS = [
  ["Fibre", "g", 30], ["Sodio", "mg", 2000, true], ["Potassio", "mg", 3900], ["Calcio", "mg", 1000],
  ["Ferro", "mg", 10], ["Magnesio", "mg", 240], ["Vitamina C", "mg", 105], ["Vitamina D", "µg", 15], ["Vitamina B12", "µg", 2.4],
];

const SOD = MICROS.findIndex(m => m[0] === "Sodio"); // in etichetta c'è il sale: sodio mg = sale g × 400

// Somme del giorno i (0=Lun): spuntato + fuori piano (rapido = solo kcal) → mac/mic; integratori spuntati → sup (micro a parte)
function dayStats(i) {
  const d = DIET[i], k = iso(i - today), done = new Set(eaten[k] || []);
  const mac = [0, 0, 0, 0], mic = MICROS.map(() => 0), sup = MICROS.map(() => 0);
  d.meals.forEach((m, mi) => m.foods.forEach((f, fi) => {
    if (!done.has(mi + "-" + fi)) return;
    f.v.forEach((v, j) => mac[j] += v);
    f.mic.forEach((v, j) => mic[j] += v);
  }));
  for (const x of offplan[k] || []) {
    mac[0] += x.k;
    x.v?.forEach((v, j) => mac[j + 1] += v);
    x.mic?.forEach((v, j) => mic[j] += v);
  }
  for (const n of suptaken[k] || []) supps.find(s => s.n === n)?.mic.forEach((v, j) => sup[j] += v);
  return { d, mac, mic, sup };
}

// Testo dell'etichetta (Live Text / Google Lens, incollato) → campi per 100 g del form fuori piano
// ponytail: primo numero dopo l'etichetta; se l'OCR separa la colonna dei valori dai nomi sbaglia → si corregge nei campi
const LABEL_RE = { h1: "proteine|proteins?", h2: "carboidrati|carbohydrates?", h3: "grassi|fats?|lipidi" };
const MICRO_RE = { Fibre: "fibr[ae]|fib(?:er|re)s?", Sodio: "sale|salt", Potassio: "potassio|potassium", Calcio: "calcio|calcium",
  Ferro: "ferro|iron", Magnesio: "magnesio|magnesium", "Vitamina C": "vitamin[ae]? c", "Vitamina D": "vitamin[ae]? d", "Vitamina B12": "vitamin[ae]? b12" };
MICROS.forEach(([n], j) => { if (MICRO_RE[n]) LABEL_RE["m" + j] = MICRO_RE[n]; });
function parseLabel(text) {
  const t = text.toLowerCase().replace(/\bo(?=[.,]\d)/g, "0").replace(/(\d),(\d)/g, "$1.$2"), N = "(\\d+(?:\\.\\d+)?)", r = {};
  const all = re => [...t.matchAll(new RegExp(re, "g"))].map(m => +m[1]);
  const kj = [...all(N + "\\s*kj"), ...all("kj\\s*[:=]?\\s*" + N)][0];
  const kc = [...all(N + "\\s*kcal"), ...all("kcal\\s*[:=]?\\s*" + N)];
  // "kJ 1550 kcal 370": 1550 è sia dopo kJ che prima di kcal → vince il valore più vicino a kJ / 4,184
  if (kc.length) r.h0 = kj ? kc.reduce((a, b) => Math.abs(b - kj / 4.184) < Math.abs(a - kj / 4.184) ? b : a) : kc[0];
  else if (kj) r.h0 = Math.round(kj / 4.184);
  for (const [f, re] of Object.entries(LABEL_RE)) {
    const m = t.match(new RegExp(`\\b(?:${re})\\b[^\\d]{0,20}?${N}`));
    if (m) r[f] = +m[1];
  }
  return r;
}

function renderStats() {
  const { d, mac, mic, sup } = dayStats(today), left = d.tot[0] - mac[0], over = left < 0;
  const done = new Set(eaten[iso(0)] || []);

  const mealDots = d.meals.map((m, mi) => {
    const n = m.foods.filter((_, fi) => done.has(mi + "-" + fi)).length, full = n === m.foods.length;
    if (full) mealsDone++; else next ||= m;
    return full ? "full" : n ? "part" : "";
  });
  let hit = 0, goals = 0;

    { l: "Settimana", c: "--violet", ic: "week", big: nClosed, of: "/ 7",
      dots: weekClosed.map((c, i) => c ? "full" : i === today ? "part" : ""), done: nClosed === 7,
      sub: streak > 1 ? `serie di ${streak} giorni` : streak === 1 ? "1 giorno chiuso di fila" : "giorni chiusi" },

    <div class="body">

      ${i.x ? `<button class="xbtn" data-del="${esc(i.n)}" aria-label="Elimina ${esc(i.n)}">${icon("x", 18)}</button>` : ""}${box()}</div>`;

    return vis.length ? `<section class="dept">

function toggleSup(n) {

$("#diet-body").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, n = f.n.value.trim(), val = x => Math.max(0, +f[x]?.value || 0);
  if (!n) return;
  if (f.id === "supadd") {
    const mic = MICROS.map((_, j) => val("m" + j));
    if (!mic.some(Boolean)) { f.querySelector("details").open = true; return f.m0.focus(); }
    supps = [...supps.filter(s => s.n !== n), { n, mic }]; return saveSup();
  }
  const g = val("g"), h = [0, 1, 2, 3].map(j => val("h" + j)), s = g / 100;
  if (g && h[0]) { // dettagliata: per 100 g × grammi mangiati

  const k = Math.round(+f.k.value);
  if (!(k > 0 && k <= 5000)) return;
  (offplan[dayKey()] ||= []).push({ n, k }); saveOff();
});
const syncReq = f => { f.k.required = !(+f.g.value > 0 && +f.h0.value > 0); }; // con grammi + kcal/100 g le kcal rapide si calcolano

// OCR in locale: Tesseract.js (Apache-2.0) in ocr/, caricato solo al primo uso (~5,6 MB, poi in cache)
// ponytail: solo core SIMD (iOS 16.4+, Chrome 91+); aggiungi tesseract-core-lstm.wasm.js e corePath a cartella se serve un telefono più vecchio
let ocrWorker = null;
async function ocr(file) {
  const st = t => { const s = $("#ocrst"); if (s) s.textContent = t; }, abs = p => new URL(p, location.href).href;
  if (!window.Tesseract) {
    st("Preparo il lettore…");
    await new Promise((ok, ko) => document.head.append(Object.assign(document.createElement("script"), { src: "ocr/tesseract.min.js", onload: ok, onerror: ko })));
  }
  ocrWorker ||= Tesseract.createWorker("ita", 1, {
    workerPath: abs("ocr/worker.min.js"), corePath: abs("ocr/tesseract-core-simd-lstm.wasm.js"), langPath: abs("ocr"), workerBlobURL: false,
    logger: m => m.progress != null && st(`${m.status === "recognizing text" ? "Leggo l'etichetta" : "Preparo il lettore"}… ${Math.round(m.progress * 100)}%`),
  }).then(async w => { await w.setParameters({ tessedit_pageseg_mode: "6" }); return w; }) // 6 = blocco unico, riga per riga: tiene nome e valore sulla stessa riga
    .catch(err => { ocrWorker = null; throw err; });
  const w = await ocrWorker;
  // foto da 12 MP → lato lungo 2000 px: molto più veloce, stessa lettura
  const img = new Image(), url = URL.createObjectURL(file);
  img.src = url; await img.decode(); URL.revokeObjectURL(url);
  const sc = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return (await w.recognize(c)).data.text;
}
$("#diet-body").addEventListener("change", async e => {
  if (e.target.name !== "photo" || !e.target.files[0]) return;
  const file = e.target.files[0], st = t => { const s = $("#ocrst"); if (s) s.textContent = t; };
  e.target.value = "";
  try {
    const text = await ocr(file), f = $("#offadd"); // il form può essere stato ridisegnato durante l'attesa
    f.label.value = text;
    const n = fillLabel(f, text);
    st(n ? `Letti ${n} valori: controllali e scrivi i grammi mangiati.` : "Nessun valore riconosciuto: riprova più vicino, dritto e con più luce.");
  } catch { st("Lettura non riuscita. Riprova, o incolla il testo qui sotto."); }
});

// --- sblocco: password → PBKDF2 → AES-GCM. Chiave derivata salvata sul telefono, password chiesta una volta sola.
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64enc = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function decrypt(key, enc) {
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct)));
}
async function deriveKey(pw, enc) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.it, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
function start(code) {
  ({ DIET, SUBS, SHOPPING, FOODS } = new Function(code + ";return {DIET,SUBS,SHOPPING,FOODS}")());
  splitMeals();
  $("#lock").hidden = true;
  renderDiet(); renderShop(); showTab(load("tab", "diet"));
}
async function boot() {
  if (!crypto.subtle) { $("#lock-err").textContent = "Serve HTTPS (o localhost) per sbloccare."; return; }
  let enc;
  try { enc = await (await fetch("data.enc.json")).json(); }
  catch { $("#lock-err").textContent = "Impossibile caricare i dati. Sei offline al primo avvio?"; return; }
  const saved = load("key", null);
  if (saved) try {
    return start(await decrypt(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]), enc));
  } catch { save("key", null); } // dati ricifrati con nuova password → richiedila
  $("#lock form").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"), pw = $("#pw").value;
    btn.disabled = true; $("#lock-err").textContent = "";
    try {
      const key = await deriveKey(pw, enc), code = await decrypt(key, enc);
      save("key", b64enc(await crypto.subtle.exportKey("raw", key)));
      start(code);
    } catch { $("#lock-err").textContent = "Password errata"; }
    btn.disabled = false;
  };
}
